server {
    listen 80 default_server;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 80;
    server_name app.avancekids.com;
    root /srv/apps/current/apps/mobile/dist;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}

server {
    listen 80;
    server_name admin.avancekids.com;
    root /srv/apps/current/apps/backoffice/dist;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}

server {
    listen 80;
    server_name avancekids.com www.avancekids.com;
    # Docker DNS is resolved on each request so replacing site keeps working.
    resolver 127.0.0.11 valid=10s;
    location / {
        set $site http://site:3000;
        proxy_pass $site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name api.avancekids.com;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s;
    # Studio and database administration remain private to the VPS.
    location ~ ^/(auth|rest|storage|functions)/v1(/|$) {
        set $api http://api-gw:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
